version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment_secret
      POSTGRES_DB: payment_processing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment_processing"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.22
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=payment
      - POSTGRES_PWD=payment_secret
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.21.3
    ports:
      - "8088:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

  payment-api:
    build:
      context: ../..
      dockerfile: services/payment-api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - TEMPORAL_HOST=temporal:7233
      - DB_HOST=postgres
      - DB_USER=payment
      - DB_PASSWORD=payment_secret
      - DB_NAME=payment_processing
      - DB_SSLMODE=disable
      - OUTBOX_CONSUMER_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3

  payment-worker:
    build:
      context: ../..
      dockerfile: services/payment-worker/Dockerfile
    environment:
      - TEMPORAL_HOST=temporal:7233
      - DB_HOST=postgres
      - DB_USER=payment
      - DB_PASSWORD=payment_secret
      - DB_NAME=payment_processing
      - DB_SSLMODE=disable
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started

  provider-simulator:
    build:
      context: ../../services/provider-simulator
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
    profiles:
      - testing

volumes:
  postgres_data:
