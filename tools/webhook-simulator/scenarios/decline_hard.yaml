name: "Hard Decline Scenarios"
target: "http://localhost:8080"

scenarios:
  - name: "stripe_expired_card"
    provider: "stripe"
    steps:
      - event: "payment_intent.payment_failed"
        data:
          payment_id: "pi_hard_001"
          amount: 10000
          currency: "usd"
          decline_code: "expired_card"
        expect_status: 200

  - name: "stripe_charge_expired"
    provider: "stripe"
    steps:
      - event: "charge.failed"
        data:
          charge_id: "ch_hard_001"
          amount: 10000
          currency: "usd"
          decline_code: "expired_card"
        expect_status: 200

  - name: "adyen_expired_card"
    provider: "adyen"
    steps:
      - event: "AUTHORISATION"
        data:
          psp_reference: "ADYEN_HARD_001"
          merchant_reference: "ORDER_HARD_001"
          amount: 10000
          currency: "USD"
          decline_code: "Refused:33"
        expect_status: 200

  - name: "adyen_invalid_card"
    provider: "adyen"
    steps:
      - event: "AUTHORISATION"
        data:
          psp_reference: "ADYEN_HARD_002"
          merchant_reference: "ORDER_HARD_002"
          amount: 10000
          currency: "USD"
          decline_code: "Refused:14"
        expect_status: 200

  - name: "paypal_expired_card"
    provider: "paypal"
    steps:
      - event: "PAYMENT.CAPTURE.DENIED"
        data:
          capture_id: "CAP-HARD-001"
          amount: 10000
          currency: "USD"
          decline_code: "CREDIT_CARD_EXPIRED"
        expect_status: 200
